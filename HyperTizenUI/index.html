<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperTizen</title>
    <link rel="stylesheet" href="main.css">
    <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
    <script src="js/wsClient.js"></script>
</head>

<body>
    <div class="content">
        <h1>HyperTizen</h1>

        <div class="panel">
            <div class="row"><span class="label">Service</span><span id="svcState" class="value bad">Connexion...</span></div>
            <div class="row"><span class="label">Capture</span><span id="capState" class="value">-</span></div>
            <div class="row"><span class="label">Mode</span><span id="capMode" class="value">-</span></div>
            <div class="row"><span class="label">HyperHDR</span><span id="hhState" class="value">-</span></div>
        </div>

        <div class="actions">
            <button id="btnLaunch" tabindex="0">Demarrer le service</button>
            <button id="btnToggle" tabindex="0">Activer la capture</button>
        </div>

        <div class="addr">
            <label for="fbsInput">Adresse de HyperHDR (IP:port)</label>
            <input type="text" id="fbsInput" tabindex="0" placeholder="192.168.1.38:19400">
            <button id="btnSave" tabindex="0">Enregistrer</button>
        </div>

        <div id="target" class="target"></div>
        <div id="message" class="message"></div>
        <pre id="logs" class="logs"></pre>
    </div>
</body>

</html>
